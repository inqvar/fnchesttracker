<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chest Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg1:#f6e6c3;--bg2:#e8c98b;--ink:#3a2410;--card:#fff8e6;--line:#d9b574;--green:#2fa84f;--greenD:#1c7a37;--blue:#2f7fe0;--blueD:#1f58a8;--gold:#f2b632;--muted:#7a5a35;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d2f3a;--bg2:#12212a;--ink:#fdf0d2;--card:#263f4d;--line:#4b6b7a;--muted:#b9c9cf}}
:root[data-theme="dark"]{--bg1:#1d2f3a;--bg2:#12212a;--ink:#fdf0d2;--card:#263f4d;--line:#4b6b7a;--muted:#b9c9cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:56px 16px 96px}
h1,h2,.count{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;margin:0}
h1{font-size:2rem;text-align:center;line-height:1.1}
.sub{text-align:center;color:var(--muted);margin:4px 0 4px}
.hero{display:flex;flex-direction:column;align-items:center}
.chest{width:min(76vw,340px);height:auto;filter:drop-shadow(0 12px 12px rgba(0,0,0,.3));transition:transform .15s;user-select:none;-webkit-user-drag:none}
.chest.hit{transform:scale(1.06) rotate(-2deg)}
.count{font-size:clamp(3.4rem,17vw,5.5rem);line-height:1;margin-top:4px;transition:transform .15s;font-variant-numeric:tabular-nums}
.count.bump{transform:scale(1.12)}
.label{color:var(--muted);margin:0 0 14px}
.btns{display:flex;gap:12px;justify-content:center;width:100%}
.btn{flex:1;max-width:210px;min-height:68px;font-family:"Lilita One",sans-serif;font-size:1.9rem;color:#fff;border:0;border-radius:20px;padding:12px 0;cursor:pointer;background:var(--green);box-shadow:0 6px 0 var(--greenD);transition:transform .08s,box-shadow .08s,background .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--greenD)}
.minus .btn{background:var(--blue);box-shadow:0 6px 0 var(--blueD)}
.minus .btn:active{box-shadow:0 2px 0 var(--blueD)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.toggle{margin:16px auto 0;display:block;font:inherit;font-weight:800;min-height:44px;background:none;border:2px dashed var(--line);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;touch-action:manipulation}
.toggle[aria-pressed="true"]{border-color:var(--blue);color:var(--blue)}
section{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:26px}
h2{font-size:1.45rem;margin-bottom:2px}
.note{color:var(--muted);margin:0;font-size:.97rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
input[type=number]{flex:1;min-width:120px;font:inherit;font-size:18px;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg1);color:var(--ink)}
.sm{font:inherit;font-weight:800;min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:var(--gold);color:#3a2410;cursor:pointer;touch-action:manipulation}
.sm.alt{background:transparent;color:var(--ink)}
.stat{display:flex;justify-content:space-around;text-align:center;margin-top:12px}
.stat b{display:block;font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.8rem}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{border-top:1px solid var(--line)}
.list label{display:flex;gap:14px;align-items:center;padding:14px 2px;min-height:60px;cursor:pointer}
.list input{width:30px;height:30px;accent-color:var(--green);flex:none}
.list .n{flex:1;min-width:0}
.list .o{font-family:"Lilita One",sans-serif;color:var(--muted);text-align:right;font-size:.95rem;max-width:34%}
.list li.done .n{text-decoration:line-through;opacity:.6}
.list li.done .o{color:var(--green)}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.95rem;color:var(--muted)}
/* floating controls */
.fab{position:fixed;z-index:20;font:inherit;font-weight:800;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--line);touch-action:manipulation}
#info{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:44px;height:44px;border-radius:50%;font-family:"Lilita One",sans-serif;font-size:1.3rem}
.pop{position:fixed;z-index:21;top:calc(64px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));max-width:min(300px,calc(100vw - 24px));background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pop[hidden]{display:none}
.pop p{margin:0}.pop a{color:var(--blue);font-weight:800;word-break:break-all}
.lang{position:fixed;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:inherit;font-weight:800;min-width:48px;min-height:40px;border:0;border-radius:999px;background:none;color:var(--ink);cursor:pointer;touch-action:manipulation}
.lang button[aria-pressed="true"]{background:var(--gold);color:#3a2410}
.keys{display:none;position:fixed;z-index:10;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:176px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:.95rem}
.keys h3{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.1rem;margin:0 0 8px}
.keys div{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.keys p{margin:10px 0 0;color:var(--muted);font-size:.85rem;line-height:1.35}
kbd{background:var(--bg1);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 8px;font:inherit;font-weight:800}
@media (hover:hover) and (pointer:fine) and (min-width:1000px){.keys{display:block}}
@media (max-width:380px){.btn{font-size:1.6rem}.list .o{font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button class="fab" id="info" type="button" aria-label="Info" aria-expanded="false" aria-controls="pop">i</button>
<div class="pop" id="pop" role="dialog" aria-label="Info" hidden>
  <p><b>Made by DJ Niche</b></p>
  <p style="margin-top:6px">More of me here:<br><a href="https://linktr.ee/djniche" target="_blank" rel="noopener noreferrer">linktr.ee/djniche</a></p>
</div>

<aside class="keys" aria-label="Keyboard shortcuts">
  <h3 data-i="keys"></h3>
  <div><span data-i="add1"></span><kbd>2</kbd></div>
  <div><span data-i="add10"></span><kbd>3</kbd></div>
  <div><span data-i="rem1"></span><kbd>7</kbd></div>
  <div><span data-i="rem10"></span><kbd>8</kbd></div>
  <p data-i="shift"></p>
</aside>

<main>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>

    <div class="count" id="count" aria-live="polite">0</div>
    <p class="label" data-i="total"></p>
    <div class="btns" id="btns">
      <button class="btn" id="b1" type="button">+1</button>
      <button class="btn" id="b10" type="button">+10</button>
    </div>
    <button class="toggle" id="tog" type="button" aria-pressed="false"></button>
  </div>

  <section>
    <h2 data-i="h_start"></h2>
    <p class="note" data-i="p_start"></p>
    <div class="row">
      <input type="number" id="start" min="0" step="1" inputmode="numeric" data-ip="ph_start">
      <button class="sm" id="setStart" type="button" data-i="set"></button>
    </div>
    <div class="stat">
      <div><b id="sess">0</b><span data-i="session"></span></div>
      <div><b id="tot">0</b><span data-i="alltime"></span></div>
    </div>
  </section>

  <section>
    <h2 data-i="h_list"></h2>
    <p class="note" data-i="p_list"></p>
    <ul class="list" id="list"></ul>
  </section>

  <section>
    <h2 data-i="h_save"></h2>
    <p class="note" data-i="p_save"></p>
    <div class="row">
      <button class="sm" id="dl" type="button" data-i="dl"></button>
      <button class="sm alt" id="imp" type="button" data-i="imp"></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>
</main>

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="de" aria-pressed="false">DE</button>
</div>

<script>
(function(){
var KEY="chest-tracker-v1";
var T={
en:{title:"Chest Tracker",sub:"Count every pirate chest you open.",total:"Chests in total",tog_on:"Misclicked? Switch to remove",tog_off:"Back to adding",
 keys:"Shortcuts",add1:"Add 1",add10:"Add 10",rem1:"Remove 1",rem10:"Remove 10",shift:"Hold Shift to remove instead of add.",
 h_start:"Opened chests already?",p_start:"Enter your current total. The page keeps counting from there.",ph_start:"e.g. 1300",set:"Set",session:"this session",alltime:"in total",
 h_list:"What you’ve got",p_list:"Tick what dropped for you. The number is the chance per chest.",
 h_save:"Save your session",p_save:"Everything is remembered in this browser. You can also save a small file and load it again later.",dl:"Download .json",imp:"Load file",
 e_num:"Please enter a number from 0.",ok_set:"Total set to ",ok_load:"Session loaded.",bad:"This file doesn’t fit the tracker.",ok_save:"File saved.",no_dl:"Downloads aren’t available here.",cancel:"Save cancelled.",fail:"Saving didn’t work.",
 items:["Weekly gold outfit","Pirate shop access","Weekly vehicle & decal","Weekly pickaxe or back bling","Weekly Jam Track","Weekly loading screen"],odds:function(n){return "1 in "+n},loc:"en-US",alt:"Golden pirate chest with a skull"},
de:{title:"Kisten-Tracker",sub:"Zähl jede Piratenkiste, die du öffnest.",total:"Kisten insgesamt",tog_on:"Verklickt? Auf Abziehen umschalten",tog_off:"Zurück zu Hinzufügen",
 keys:"Tastenkürzel",add1:"+1",add10:"+10",rem1:"−1",rem10:"−10",shift:"Mit gedrückter Shift-Taste wird abgezogen statt addiert.",
 h_start:"Schon Kisten geöffnet?",p_start:"Trag deinen bisherigen Stand ein, ab dann zählt die Seite weiter.",ph_start:"z. B. 1300",set:"Setzen",session:"diese Sitzung",alltime:"insgesamt",
 h_list:"Das hast du schon bekommen",p_list:"Hak ab, was dir gedroppt ist. Die Zahl ist die Chance pro Kiste.",
 h_save:"Sitzung speichern",p_save:"Alles bleibt in diesem Browser gespeichert. Zusätzlich kannst du eine kleine Datei sichern und später wieder laden.",dl:".json herunterladen",imp:"Datei laden",
 e_num:"Bitte eine Zahl ab 0 eingeben.",ok_set:"Stand gesetzt: ",ok_load:"Sitzung geladen.",bad:"Diese Datei passt nicht zum Tracker.",ok_save:"Datei gespeichert.",no_dl:"Download ist hier nicht möglich.",cancel:"Speichern abgebrochen.",fail:"Speichern hat nicht geklappt.",
 items:["Goldenes Outfit der Woche","Zugang zum Piraten-Shop","Fahrzeug & Abziehbild der Woche","Spitzhacke oder Rücken-Accessoire der Woche","Jam-Track der Woche","Ladebildschirm der Woche"],odds:function(n){return "1 zu "+n},loc:"de-DE",alt:"Goldene Piratenkiste mit Totenkopf"}
};
var IDS=["gold","shop","car","pick","jam","load"],ODDS=[1562500,137500,7813,568,391,272];
var S={total:0,session:0,checks:{},lang:"en"};
function $(i){return document.getElementById(i)}
function L(){return T[S.lang]}
function fmt(n){return n.toLocaleString(L().loc)}
function load(){try{var r=localStorage.getItem(KEY);if(r)merge(JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function merge(d){
 if(!d||typeof d!=="object")return false;
 var t=parseInt(d.total,10),s=parseInt(d.session,10);
 if(isNaN(t)||t<0)return false;
 S.total=t;S.session=isNaN(s)?0:s;
 if(d.lang==="en"||d.lang==="de")S.lang=d.lang;
 S.checks={};IDS.forEach(function(id){S.checks[id]=!!(d.checks&&d.checks[id])});
 return true;
}
var minus=false,shift=false,lastMsg=null;
function setMode(){
 var m=minus||shift;
 $("hero").classList.toggle("minus",m);$("btns").classList.toggle("minus",m);
 $("b1").textContent=m?"−1":"+1";$("b10").textContent=m?"−10":"+10";
 $("tog").setAttribute("aria-pressed",String(minus));
 $("tog").textContent=minus?L().tog_off:L().tog_on;
}
function applyLang(){
 var l=L();document.documentElement.lang=S.lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=l[e.getAttribute("data-i")]});
 document.querySelectorAll("[data-ip]").forEach(function(e){e.placeholder=l[e.getAttribute("data-ip")]});
 $("chest").alt=l.alt;
 document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===S.lang))});
 IDS.forEach(function(id,i){var li=$("li-"+id);li.querySelector(".n").textContent=l.items[i];li.querySelector(".o").textContent=l.odds(fmt(ODDS[i]))});
 setMode();say(lastMsg);
}
function render(bump){
 $("count").textContent=fmt(S.total);$("tot").textContent=fmt(S.total);
 $("sess").textContent=(S.session>0?"+":"")+fmt(S.session);
 IDS.forEach(function(id){var li=$("li-"+id);li.classList.toggle("done",!!S.checks[id]);li.querySelector("input").checked=!!S.checks[id]});
 if(bump)["count","chest"].forEach(function(id){var e=$(id),c=id==="count"?"bump":"hit";e.classList.add(c);setTimeout(function(){e.classList.remove(c)},150)});
 save();
}
function say(k,extra){lastMsg=k;$("msg").textContent=k?(L()[k]+(extra||"")):""}
function add(n){var nt=Math.max(0,S.total+n);S.session+=nt-S.total;S.total=nt;render(true)}
function press(n,e){add((minus||shift||(e&&e.shiftKey))?-n:n)}
$("b1").addEventListener("click",function(e){press(1,e)});
$("b10").addEventListener("click",function(e){press(10,e)});
$("tog").addEventListener("click",function(){minus=!minus;setMode()});
document.addEventListener("keydown",function(e){
 if(e.key==="Shift"){shift=true;setMode();return}
 var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 var c=e.code,k=e.key;
 if(c==="Digit2"||k==="2")add(1);else if(c==="Digit3"||k==="3")add(10);
 else if(c==="Digit7"||k==="7")add(-1);else if(c==="Digit8"||k==="8")add(-10);
 else if(k==="Escape")closePop();
});
document.addEventListener("keyup",function(e){if(e.key==="Shift"){shift=false;setMode()}});
window.addEventListener("blur",function(){shift=false;setMode()});

$("setStart").addEventListener("click",function(){
 var v=parseInt($("start").value,10);
 if(isNaN(v)||v<0){say("e_num");return}
 S.total=v;S.session=0;$("start").value="";render(true);say("ok_set",fmt(v));
});
$("start").addEventListener("keydown",function(e){if(e.key==="Enter")$("setStart").click()});

IDS.forEach(function(id){
 var li=document.createElement("li");li.id="li-"+id;
 li.innerHTML='<label><input type="checkbox"><span class="n"></span><span class="o"></span></label>';
 li.querySelector("input").addEventListener("change",function(e){S.checks[id]=e.target.checked;render(false)});
 $("list").appendChild(li);
});

document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){S.lang=b.getAttribute("data-lang");applyLang();render(false)})});

function closePop(){$("pop").hidden=true;$("info").setAttribute("aria-expanded","false")}
$("info").addEventListener("click",function(e){e.stopPropagation();var o=$("pop").hidden;$("pop").hidden=!o;$("info").setAttribute("aria-expanded",String(o))});
document.addEventListener("click",function(e){if(!$("pop").hidden&&!$("pop").contains(e.target))closePop()});

$("dl").addEventListener("click",function(){
 var data=JSON.stringify({app:"chest-tracker",version:2,saved:new Date().toISOString(),lang:S.lang,total:S.total,session:S.session,checks:S.checks},null,2);
 var name="chest-tracker-"+new Date().toISOString().slice(0,10)+".json";
 var blob=new Blob([data],{type:"application/json"});
 if(window.claude&&claude.use){
  claude.use("downloads").then(function(d){
   if(!d){say("no_dl");return}
   return d.save({filename:name,data:blob}).then(function(){say("ok_save")},function(err){say(err&&err.code==="declined"?"cancel":"fail")});
  });
 }else{
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();say("ok_save");
 }
});
$("imp").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(e){
 var f=e.target.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){try{if(merge(JSON.parse(r.result))){applyLang();render(true);say("ok_load")}else say("bad")}catch(x){say("bad")}};
 r.readAsText(f);e.target.value="";
});

IDS.forEach(function(id){S.checks[id]=false});
load();applyLang();render(false);
})();
</script>
</body>
</html>
