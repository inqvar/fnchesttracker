<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chest Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="fab" id="info" type="button" aria-label="Info" aria-expanded="false" aria-controls="pop">i</button>
<div class="pop" id="pop" role="dialog" aria-label="Info" hidden>
  <p><b>Made by DJ Niche</b></p>
  <p style="margin-top:6px">More of me here:<br><a href="https://linktr.ee/djniche" target="_blank" rel="noopener noreferrer">linktr.ee/djniche</a></p>
</div>

<aside class="keys" aria-label="Keyboard shortcuts">
  <h3 data-i="keys"></h3>
  <div><span data-i="add1"></span><kbd>2</kbd></div>
  <div><span data-i="add10"></span><kbd>3</kbd></div>
  <div><span data-i="rem1"></span><kbd>7</kbd></div>
  <div><span data-i="rem10"></span><kbd>8</kbd></div>
  <p data-i="shift"></p>
</aside>

<main>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="hero" id="hero">
    <img class="chest" id="chest" width="640" height="426" alt="" src="media/chest.webp">
    <div class="count" id="count" aria-live="polite">0</div>
    <p class="label" data-i="total"></p>
    <div class="btns" id="btns">
      <button class="btn" id="b1" type="button">+1</button>
      <button class="btn" id="b10" type="button">+10</button>
    </div>
    <button class="toggle" id="tog" type="button" aria-pressed="false"></button>
  </div>

  <section>
    <h2 data-i="h_start"></h2>
    <p class="note" data-i="p_start"></p>
    <div class="row">
      <input type="number" id="start" min="0" step="1" inputmode="numeric" data-ip="ph_start">
      <button class="sm" id="setStart" type="button" data-i="set"></button>
    </div>
    <div class="stat">
      <div><b id="sess">0</b><span data-i="session"></span></div>
      <div><b id="tot">0</b><span data-i="alltime"></span></div>
    </div>
  </section>

  <section>
    <h2 data-i="h_list"></h2>
    <p class="note" data-i="p_list"></p>
    <ul class="list" id="list"></ul>
  </section>

  <section>
    <h2 data-i="h_sim"></h2>
    <p class="note" data-i="p_sim"></p>
    <div class="row">
      <label class="fld"><span data-i="sim_chests"></span><input type="number" id="simC" value="10" min="1" step="1" inputmode="numeric"></label>
      <label class="fld"><span data-i="sim_per"></span><input type="number" id="simS" value="1" min="0.1" step="any" inputmode="decimal"></label>
    </div>
    <div class="row">
      <button class="sm" id="simGo" type="button"></button>
      <button class="sm alt" id="simReset" type="button" data-i="sim_reset"></button>
      <button class="sm alt" id="simSkip" type="button" data-i="sim_skip"></button>
    </div>
    <div class="stat">
      <div><b id="simN">0</b><span data-i="sim_opened"></span></div>
      <div><b id="simT">0</b><span data-i="sim_time"></span></div>
    </div>
    <ul class="list sim" id="simList"></ul>
  </section>

  <section>
    <h2 data-i="h_save"></h2>
    <p class="note" data-i="p_save"></p>
    <div class="row">
      <button class="sm" id="dl" type="button" data-i="dl"></button>
      <button class="sm alt" id="imp" type="button" data-i="imp"></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>
</main>

<div class="lang" id="lang">
  <button class="cur" id="langCur" type="button" aria-haspopup="true" aria-expanded="false"></button>
  <div class="opts" id="langOpts"></div>
</div>

<script src="script.js"></script>
</body>
</html>
